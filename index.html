<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowFund</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="simulator">
        <h2>Investment Simulator</h2>
        <label for="investment-amount">Investment Amount</label>
            <input id="investment-amount" type="number" min="1000" step="100">

        <label for="monthly-rate">Monthly Rate</label>
            <input id="monthly-rate" type="number" min="0" step="0.1">

        <label for="investment-period">Investment Period</label>
            <input id="investment-period" type="number" min="1" step="1">

        <button id="calculate-btn">Calculate</button>
        <p id="error-message"></p>
    </div>
    <div class="result">
        <h3>Result</h3>
        <p>Principal: <span id="pricipal-result">0.00</span> RWF</p>
        <p>Monthly Earnings: <span id="monthly-earnings-result">0.00</span> RWF</p>
        <p>Total Earnings: <span id="total-earning-result">0.00</span> RWF</p>
        <p>Maturity Value: <span id="maturity-value-result">0.00</span> RWF</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
